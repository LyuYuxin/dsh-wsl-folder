name: sync-release-notes

# Pushing a changed note under .github/release-notes/ updates the matching
# GitHub Release body, so a typo fix does not need a new tag.
on:
  push:
    branches: [main]
    paths: ['.github/release-notes/**']

permissions:
  contents: write

jobs:
  sync:
    name: update release bodies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply changed notes to existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in .github/release-notes/v*.md; do
            tag="$(basename "$file" .md)"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file "$file"
              echo "updated release $tag"
            else
              echo "no release for $tag yet; skipped"
            fi
          done
